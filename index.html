<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ssvarma</title>
    <meta
      name="description"
      content="A simple public notebook for 100 days of CUDA and inference engineering."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23070812'/%3E%3Cpath d='M12 42h10v10H12zM27 17h10v10H27zM43 31h10v10H43z' fill='%23a7f3ff'/%3E%3Cpath d='M18 46 47 17' stroke='%23ffcc66' stroke-width='5'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #070812;
        --panel: rgba(8, 10, 22, 0.74);
        --paper: rgba(12, 15, 29, 0.82);
        --line: rgba(181, 204, 255, 0.18);
        --text: #f5f0df;
        --muted: #aeb4c7;
        --dim: #707891;
        --cyan: #a7f3ff;
        --yellow: #ffcc66;
        --pink: #ff7ab6;
        --green: #8fffca;
        font-family:
          ui-monospace, "SFMono-Regular", "Cascadia Code", "Roboto Mono",
          Menlo, Consolas, monospace;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 16% 18%, rgba(167, 243, 255, 0.12), transparent 27rem),
          radial-gradient(circle at 86% 12%, rgba(255, 122, 182, 0.1), transparent 24rem),
          linear-gradient(180deg, #070812 0%, #101426 54%, #080914 100%);
        color: var(--text);
        letter-spacing: 0;
      }

      body::before {
        position: fixed;
        inset: 0;
        pointer-events: none;
        content: "";
        background-image:
          radial-gradient(circle, rgba(255, 255, 255, 0.64) 1px, transparent 1px),
          linear-gradient(rgba(167, 243, 255, 0.055) 1px, transparent 1px),
          linear-gradient(90deg, rgba(167, 243, 255, 0.055) 1px, transparent 1px);
        background-size:
          83px 83px,
          32px 32px,
          32px 32px;
        mask-image: linear-gradient(to bottom, black 0%, black 62%, transparent 100%);
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .layout {
        position: relative;
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
        min-height: 100vh;
      }

      aside {
        position: sticky;
        top: 0;
        height: 100vh;
        overflow: auto;
        padding: 24px 18px;
        border-right: 1px solid var(--line);
        background: rgba(7, 8, 18, 0.78);
        backdrop-filter: blur(18px);
      }

      .brand {
        display: grid;
        gap: 12px;
        margin-bottom: 28px;
      }

      .badge {
        width: 42px;
        height: 42px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background:
          linear-gradient(135deg, rgba(167, 243, 255, 0.26), transparent),
          #101426;
        box-shadow: 0 0 28px rgba(167, 243, 255, 0.12);
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 8px;
        font-size: 0.92rem;
        font-weight: 500;
      }

      .brand p,
      .hint,
      .muted {
        color: var(--muted);
        font-size: 0.74rem;
        line-height: 1.65;
      }

      .track {
        display: grid;
        gap: 10px;
        margin-bottom: 24px;
      }

      .track-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .track-title {
        color: var(--yellow);
        font-size: 0.7rem;
        font-weight: 500;
      }

      .new-page {
        min-height: 30px;
        padding: 0 9px;
        border: 1px dashed var(--line);
        border-radius: 6px;
        background: rgba(167, 243, 255, 0.08);
        color: var(--cyan);
        font-size: 0.7rem;
      }

      .pages {
        display: grid;
        gap: 6px;
      }

      .page-link {
        width: 100%;
        padding: 10px;
        border: 1px dashed transparent;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        font-size: 0.78rem;
        text-align: left;
      }

      .page-link:hover,
      .page-link[aria-current="page"] {
        border-color: var(--line);
        background: rgba(167, 243, 255, 0.07);
        color: var(--text);
      }

      .page-link span {
        display: block;
        margin-top: 4px;
        color: var(--dim);
        font-size: 0.68rem;
      }

      .empty-track {
        padding: 10px;
        border: 1px dashed rgba(181, 204, 255, 0.14);
        border-radius: 6px;
        color: var(--dim);
        font-size: 0.7rem;
        line-height: 1.5;
      }

      main {
        padding: 50px min(8vw, 96px);
      }

      .workspace {
        max-width: 880px;
        min-height: calc(100vh - 100px);
      }

      .topline {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 18px;
        color: var(--yellow);
        font-size: 0.76rem;
      }

      .pixel {
        width: 10px;
        height: 10px;
        background: currentColor;
        box-shadow:
          14px 0 0 var(--cyan),
          28px 0 0 var(--pink);
      }

      .welcome,
      .editor {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: linear-gradient(180deg, rgba(20, 24, 44, 0.9), var(--paper));
        box-shadow: 0 22px 70px rgba(0, 0, 0, 0.34);
      }

      .welcome {
        display: grid;
        min-height: calc(100vh - 100px);
        place-items: center;
        padding: clamp(24px, 5vw, 46px);
        border-color: rgba(181, 204, 255, 0.1);
        background: transparent;
        box-shadow: none;
      }

      .welcome h2 {
        margin: 0;
        padding: 8px 10px;
        border: 1px dashed rgba(167, 243, 255, 0.24);
        border-radius: 6px;
        background: rgba(7, 8, 18, 0.34);
        color: rgba(245, 240, 223, 0.72);
        text-decoration: underline dashed rgba(167, 243, 255, 0.42);
        text-underline-offset: 5px;
        font-family:
          ui-monospace, "SFMono-Regular", "Cascadia Code", "Roboto Mono",
          Menlo, Consolas, monospace;
        font-size: 0.86rem;
        font-weight: 400;
        line-height: 1.2;
        letter-spacing: 0;
      }

      .welcome p {
        max-width: 650px;
        color: var(--muted);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        font-size: 1.02rem;
        line-height: 1.7;
      }

      .editor {
        overflow: hidden;
        border-style: dashed;
      }

      .editor-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
        background: rgba(7, 8, 18, 0.5);
      }

      .editor-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .action {
        min-height: 34px;
        padding: 0 10px;
        border: 1px dashed var(--line);
        border-radius: 6px;
        background: rgba(167, 243, 255, 0.08);
        color: var(--text);
        font-size: 0.7rem;
      }

      .action.danger {
        color: var(--pink);
      }

      .article-sheet {
        padding: clamp(22px, 5vw, 52px);
      }

      .title-input,
      .meta-input,
      .body-editor {
        width: 100%;
        border: 0;
        background: transparent;
        color: var(--text);
        outline: 0;
      }

      .title-input {
        margin-bottom: 14px;
        font-family:
          ui-monospace, "SFMono-Regular", "Cascadia Code", "Roboto Mono",
          Menlo, Consolas, monospace;
        font-size: clamp(1.4rem, 4vw, 2.8rem);
        font-weight: 500;
        line-height: 1.08;
        letter-spacing: 0;
      }

      .title-input::placeholder,
      .meta-input::placeholder,
      .body-editor:empty::before {
        color: rgba(245, 240, 223, 0.34);
      }

      .meta-line {
        display: grid;
        grid-template-columns: 110px minmax(0, 1fr);
        gap: 12px;
        margin-bottom: 30px;
      }

      .meta-input {
        min-height: 34px;
        border-bottom: 1px dashed rgba(181, 204, 255, 0.18);
        color: var(--muted);
        font-size: 0.76rem;
      }

      .body-editor {
        min-height: 390px;
        color: #d9d9e4;
        font-family:
          ui-monospace, "SFMono-Regular", "Cascadia Code", "Roboto Mono",
          Menlo, Consolas, monospace;
        font-size: 0.92rem;
        line-height: 1.8;
        white-space: pre-wrap;
      }

      .body-editor:empty::before {
        content: "Start writing your blog page here...";
      }

      .saved {
        color: var(--green);
        font-size: 0.7rem;
      }

      @media (max-width: 820px) {
        .layout {
          grid-template-columns: 1fr;
        }

        aside {
          position: relative;
          height: auto;
        }

        main {
          padding: 28px 16px;
        }
      }

      @media (max-width: 520px) {
        .meta-line {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside>
        <div class="brand">
          <div class="badge" aria-hidden="true"></div>
          <div>
            <h1>ssvarma</h1>
          </div>
        </div>

        <section class="track" aria-labelledby="cudaHeading">
          <div class="track-head">
            <h2 class="track-title" id="cudaHeading">CUDA 100 Days</h2>
          </div>
        </section>

        <section class="track" aria-labelledby="inferenceHeading">
          <div class="track-head">
            <h2 class="track-title" id="inferenceHeading">Inference Engineering 100 Days</h2>
          </div>
        </section>
      </aside>

      <main>
        <div class="workspace">
          <section class="welcome">
            <h2>Hello World!</h2>
          </section>
        </div>
      </main>
    </div>
  </body>
</html>
